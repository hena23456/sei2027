<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7d243c">
<title>二十歳のつどい 2027｜記念フォト</title>
<style>
:root{--wine:#7d243c;--gold:#b58a45;--paper:#fffaf2}
*{box-sizing:border-box}
body{margin:0;background:#f5eee6;color:#382b27;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;text-align:center}
main{max-width:620px;margin:auto;padding:18px 14px 32px}
h1{color:var(--wine);font-size:clamp(25px,6vw,36px);margin:8px 0 2px}
.sub{color:#876a52;margin:0 0 16px}
.stage{position:relative;width:100%;aspect-ratio:3/4;background:#211b1b;border-radius:18px;overflow:hidden;box-shadow:0 5px 22px #0002}
video{width:100%;height:100%;object-fit:cover;display:block}
#frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}
button{border:0;border-radius:999px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer}
.primary{background:var(--wine);color:white;min-width:190px}
.secondary{background:#fff;color:var(--wine);border:1px solid #d8c3b5}
button:disabled{opacity:.45}
.note{font-size:13px;color:#786c65;line-height:1.7}
#result{display:none;margin-top:18px}
#photo{width:100%;border-radius:14px;background:white}
#count{position:absolute;inset:0;display:none;place-items:center;color:white;font-size:90px;font-weight:800;text-shadow:0 2px 15px #000}
</style>
</head>
<body>
<main>
  <h1>二十歳のつどい</h1>
  <p class="sub">2027 記念フォト</p>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <svg id="frame" viewBox="0 0 600 800" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#f7e6b5"/><stop offset=".5" stop-color="#bd914b"/><stop offset="1" stop-color="#f8e8bd"/>
        </linearGradient>
      </defs>
      <rect x="12" y="12" width="576" height="776" rx="24" fill="none" stroke="url(#g)" stroke-width="12"/>
      <rect x="27" y="27" width="546" height="746" rx="18" fill="none" stroke="#fff4d9" stroke-width="2"/>
      <path d="M28 130 Q300 35 572 130" fill="none" stroke="#fff0ce" stroke-width="3"/>
      <text x="300" y="82" text-anchor="middle" font-size="43" font-weight="700" fill="#fff8e8" stroke="#8a2942" stroke-width="1.5" paint-order="stroke">祝　二十歳</text>
      <text x="300" y="742" text-anchor="middle" font-size="27" font-weight="700" fill="#fff8e8" stroke="#8a2942" stroke-width="1.2" paint-order="stroke">二十歳のつどい 2027</text>
      <text x="65" y="75" font-size="34" fill="#f7dfaa">✿</text><text x="500" y="75" font-size="34" fill="#f7dfaa">✿</text>
      <text x="48" y="720" font-size="28" fill="#f7dfaa">✿</text><text x="520" y="720" font-size="28" fill="#f7dfaa">✿</text>
    </svg>
    <div id="count"></div>
  </div>
  <div class="controls">
    <button class="primary" id="start">カメラを起動</button>
    <button class="secondary" id="switch" disabled>前・背面を切替</button>
    <button class="primary" id="shoot" disabled>3秒後に撮影</button>
  </div>
  <p class="note">カメラの使用を許可してください。撮影した写真はこの端末内で合成します。<br>このサンプルでは写真を外部サーバーへ送信しません。</p>
  <section id="result">
    <h2>完成した記念写真</h2>
    <img id="photo" alt="完成した記念写真">
    <div class="controls">
      <a id="download" download="二十歳のつどい_記念写真.png"><button class="primary">写真を保存する</button></a>
      <button class="secondary" id="again">もう一度撮影</button>
    </div>
  </section>
</main>
<canvas id="canvas" hidden></canvas>
<script>
const video=document.querySelector('#video'), start=document.querySelector('#start');
const shoot=document.querySelector('#shoot'), sw=document.querySelector('#switch');
let stream=null, facing='user';
async function openCamera(){
  if(!navigator.mediaDevices?.getUserMedia){alert('カメラ起動にはHTTPSで公開されたページが必要です。');return;}
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:facing}});
    video.srcObject=stream; await video.play();
    shoot.disabled=false; sw.disabled=false; start.textContent='カメラ起動中';
  }catch(e){alert('カメラを起動できませんでした。ブラウザのカメラ使用を許可してください。');}
}
start.addEventListener('click',openCamera);
sw.addEventListener('click',async()=>{facing=facing==='user'?'environment':'user';await openCamera();});
shoot.addEventListener('click',async()=>{
  if(!video.videoWidth){alert('カメラ映像を確認してください。');return;}
  shoot.disabled=true; const count=document.querySelector('#count');
  count.style.display='grid';
  for(let n=3;n>0;n--){count.textContent=n;await new Promise(r=>setTimeout(r,850));}
  count.style.display='none';
  const c=document.querySelector('#canvas'),ctx=c.getContext('2d');
  const w=900,h=1200;c.width=w;c.height=h;
  // Cover-crop camera image to portrait canvas
  const scale=Math.max(w/video.videoWidth,h/video.videoHeight);
  const dw=video.videoWidth*scale,dh=video.videoHeight*scale;
  ctx.drawImage(video,(w-dw)/2,(h-dh)/2,dw,dh);
  // Draw a matching decorative frame and titles directly onto the photo
  ctx.strokeStyle='#d4ad68';ctx.lineWidth=22;ctx.strokeRect(18,18,w-36,h-36);
  ctx.strokeStyle='#fff0ce';ctx.lineWidth=4;ctx.strokeRect(43,43,w-86,h-86);
  ctx.textAlign='center';ctx.lineJoin='round';
  ctx.font='bold 68px sans-serif';ctx.lineWidth=8;ctx.strokeStyle='#8a2942';ctx.strokeText('祝　二十歳',w/2,112);ctx.fillStyle='#fff8e8';ctx.fillText('祝　二十歳',w/2,112);
  ctx.font='bold 39px sans-serif';ctx.lineWidth=6;ctx.strokeStyle='#8a2942';ctx.strokeText('二十歳のつどい 2027',w/2,h-70);ctx.fillStyle='#fff8e8';ctx.fillText('二十歳のつどい 2027',w/2,h-70);
  const url=c.toDataURL('image/png');document.querySelector('#photo').src=url;
  const dl=document.querySelector('#download');dl.href=url;
  document.querySelector('#result').style.display='block';shoot.disabled=false;
  document.querySelector('#result').scrollIntoView({behavior:'smooth'});
});
document.querySelector('#again').addEventListener('click',()=>{document.querySelector('#result').style.display='none';});
</script>
</body>
</html>
